name: Build and push Docker image

on:
  # 推送 v* 标签时构建正式版本镜像（如 v0.1.16）。
  push:
    tags:
      - 'v*'
  # 手动触发时构建当前分支，镜像 tag 为分支名和 commit SHA。
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 生成镜像 tag：
      #   - 推 v0.1.16 标签 -> ghcr.io/deviseo/transit-hub:v0.1.16 + :latest
      #   - 手动触发       -> ghcr.io/deviseo/transit-hub:<分支名> + :sha-<短SHA>
      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          # 服务器是 x86 用 linux/amd64 即可；ARM 服务器可改为 linux/amd64,linux/arm64。
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
